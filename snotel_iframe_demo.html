<!-- file: snotel_iframe_demo.html -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SNOTEL Chart Embed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style> body{margin:0;padding:0;font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial} .wrap{max-width:1100px;margin:32px auto;padding:0 16px} h1{font-size:20px;margin:0 0 12px} .frame{width:100%;height:560px;border:0} code{background:#f3f4f6;padding:2px 6px;border-radius:4px} </style>
  </head>
  <body>
    <div class="wrap">
      <h1>SNOTEL NRCS Chart Embed (iframe)</h1>
      <p>URL:</p>
      <code id="u"></code>
      <iframe id="f" class="frame" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <script>
      // Edit these:
      const stationName = "Stuart Mountain";  // exact NRCS page title
      const stateCode   = "MT";               // e.g., MT, ID, WA
      const chartType   = "WTEQ";             // or "PCTMED"
      const showYears   = "2025";             // e.g., "2025" or "2024,2025" or "" for default

      const encodedName = encodeURIComponent(stationName);
      const params = ["hideAnno=true","hideControls=true","activeOnly=true"]
      if (showYears) params.push("showYears="+showYears);
      const url = `https://nwcc-apps.sc.egov.usda.gov/awdb/site-plots/POR/${chartType}/${stateCode}/${encodedName}.html?` + params.join("&");

      document.getElementById("u").textContent = url;
      document.getElementById("f").src = url;
    </script>
  </body>
</html>
