name: Scrape Montana Resorts
on:
  workflow_dispatch: # This lets you run it manually from GitHub's website
  schedule:
    # This runs every 10 minutes between 12:00 and 17:50 UTC
    # (5:00 AM - 10:50 AM MST)
    - cron: '*/10 12-17 * * *'
jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: playwright install chromium --with-deps

    - name: Install Playwright system deps only (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: playwright install-deps chromium

    - name: Create data directory
      run: mkdir -p ~/snow_reports/data ~/snow_reports/logs

    - name: Set up Firebase credentials
      env:
        FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        echo "$FIREBASE_CREDS" > firebase-service-account.json

    - name: Run scraper with Firebase upload
      env:
        FIREBASE_SERVICE_ACCOUNT: firebase-service-account.json
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: python run_scraper_with_firebase.py
      
    - name: Clean up credentials
      if: always()
      run: |
        rm -f firebase-service-account.json
